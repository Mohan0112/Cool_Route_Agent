<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Sundodger mark: a route that swerves away from the sun into the shade.
       Solid orange ground so the glyph keeps contrast on light AND dark browser
       tab bars; a stroke-only mark disappears on one of the two. -->
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#sd-bg)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <!-- sun, upper right -->
    <circle cx="22.5" cy="9" r="3.6" fill="#fff" stroke="none"/>
    <g stroke-width="1.6">
      <path d="M22.5 2.2v1.9"/>
      <path d="M28.6 9h-1.9"/>
      <path d="M27 4.5l-1.4 1.4"/>
      <path d="M18 4.5l1.4 1.4"/>
      <path d="M27 13.5l-1.4-1.4"/>
    </g>
    <!-- the dodge: climbs, then ducks away and down from the sun -->
    <path d="M5 27c0-7 5.5-9 9.5-9s5.5 4.5 11 4.5" stroke-width="3.2"/>
  </g>
</svg>
